name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # update tiap hari
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Hanifz99

          template: classic
          base: header, activity, community, repositories

          languages: yes
          languages_details: bytes-size, percentage

          achievements: yes
          achievements_display: compact

          stargazers: yes
          followers: yes

          output_action: commit
          filename: github-metrics.svg
