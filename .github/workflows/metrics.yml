- name: Main metrics
  uses: lowlighter/metrics@latest
  with:
    token: ${{ secrets.METRICS_TOKEN }}
    user: Hanifz99

    template: classic
    base: header, activity, repositories

    plugin_licenses: yes
    plugin_licenses_setup: npm
    plugin_licenses_limit: 8

    output_action: commit
    filename: github-metrics.svg

